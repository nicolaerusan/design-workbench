version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release, so a compromised version is usually
    # caught and withdrawn first. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      ui:
        patterns:
          - '@radix-ui/*'
          - lucide-react
          - class-variance-authority
          - clsx
          - react-resizable-panels
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
